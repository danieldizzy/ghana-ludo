<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1206" />
  <title>Ghana Ludo</title>
  <meta name="description" content="A Ludo game with Ghanaian / Adinkra theming. Oware mode coming soon." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Ghana Ludo</h1>
    <p class="tagline">Classic Ludo, Adinkra-themed. <span class="soon">Oware mode coming soon.</span></p>
  </header>

  <main>
    <!-- Setup overlay (shown before a game) -->
    <section class="setup-screen" id="setup">
      <div class="setup-card">
        <h2>New Game</h2>
        <label for="playerCount">How many players?</label>
        <select id="playerCount">
          <option value="2">2 players</option>
          <option value="3">3 players</option>
          <option value="4" selected>4 players</option>
        </select>
        <label for="aiCount">AI opponents?</label>
        <select id="aiCount">
          <option value="0">0 — all human</option>
          <option value="1" selected>1 AI</option>
          <option value="2">2 AI</option>
          <option value="3">3 AI</option>
        </select>
        <label class="toggle"><input type="checkbox" id="soundToggle" checked /> Sound effects</label>
        <button id="startBtn" type="button">Start Game</button>
      </div>
    </section>

    <!-- Game layout: board + side panel -->
    <div class="game-layout hidden" id="gameLayout">
      <div class="board-wrap">
        <canvas id="board" width="600" height="600" aria-label="Ludo board"></canvas>
        <div class="banner" id="banner" aria-live="assertive"></div>
        <canvas id="fx" class="fx" width="600" height="600" aria-hidden="true"></canvas>
      </div>

      <aside class="panel">
        <div class="status-card" id="status">—</div>

        <div class="dice-area">
          <div class="dice3d" id="dice" aria-live="polite" title="Dice">
            <span id="diceFace">·</span>
          </div>
          <button id="rollBtn" type="button" class="big">Roll Dice</button>
        </div>

        <section class="legend" id="legend" aria-label="Players"></section>

        <button id="resetBtn" type="button" class="secondary">New Game</button>
      </aside>
    </div>
  </main>

  <footer>
    <p>Built for fun · hot-seat multiplayer · <a href="https://danieldizzy.github.io">danieldizzy.github.io</a></p>
  </footer>

  <script src="game.js"></script>
</body>
</html>
